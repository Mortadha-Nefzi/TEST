apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: example-api-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: apiapp.102.211.209.177.nip.io    # ?? changed
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: example-api-service
            port:
              number: 80
